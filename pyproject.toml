[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ping-base"
version = "0.1.0"
description = "PING rover base station controller input and diagnostic viewer"
requires-python = ">=3.10"
dependencies = ["pygame==2.6.1"]

[project.scripts]
ping-controller = "ping_base.app:main"

[tool.setuptools.packages.find]
where = ["src"]
